 
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  .vevly-why-choose{
    /* All theme variables are scoped to this wrapper only —
       they will never affect the rest of the page. */
    --navy-950: #347E7D;
    --navy-900: #347E7D;
    --navy-800: #347E7D;
    --ice-100: #eef3fb;
    --ice-200: #aac2c2;
    --sky-400: #347E7D;
    --sky-500: #347E7D;
    --paper: #fbfcfe;
    --ink-600: #040505;
    --ink-800: #347E7D;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .vevly-why-choose,
  .vevly-why-choose *{
    box-sizing: border-box;
  }

  .vevly-why-choose{
    background:
      radial-gradient(60% 50% at 18% 20%, rgba(127,168,224,0.10), transparent 60%),
      radial-gradient(50% 45% at 85% 80%, rgba(127,168,224,0.08), transparent 60%),
      var(--paper);
    font-family: var(--font-body);
    color: var(--ink-800);
    overflow: hidden;
    position: relative;
     margin: 0;
    line-height: 1.6;
  }

  .vevly-inner{
    max-width: 1180px;
    margin: 0 auto;
    position: relative;
  }

  .vevly-heading{
    text-align: center;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(30px, 4.2vw, 46px);
    letter-spacing: 0.2px;
    color: var(--navy-950);
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .vevly-heading em{
    font-style: italic;
    font-weight: 500;
    color: var(--sky-500);
    position: relative;
  }
  .vevly-heading em::after{
    content:"";
    position:absolute;
    left: 2%; right: 2%; bottom: -4px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--sky-400) 20%, var(--sky-400) 80%, transparent);
    border-radius: 2px;
  }

  .vevly-sub{
    text-align:center;
    max-width: 460px;
    margin: 0 auto 56px;
    color: var(--ink-600);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ---------- stage layout ---------- */
  .vevly-stage{
    display: grid;
    grid-template-columns: 1fr minmax(260px, 380px) 1fr;
    align-items: center;
    gap: 8px;
    min-height: 540px;
    position: relative;
  }

  .vevly-col{
    display: flex;
    flex-direction: column;
    gap: 60px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .vevly-col.right{ align-items: flex-start; }
  .vevly-col.left{ align-items: flex-end; text-align: right; }

  .vevly-feature{
    max-width: 280px;
    display: flex;
    gap: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: vevlyFeatureIn 700ms ease forwards;
  }
  .vevly-col.left .vevly-feature{ flex-direction: row-reverse; }

  @keyframes vevlyFeatureIn{
    to{ opacity: 1; transform: translateY(0); }
  }

  .vevly-icon{
    flex: none;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--sky-400), var(--sky-500));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(77,121,184,0.55);
  }
  .vevly-icon svg{ width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.7; }

  .vevly-feature h3{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 19px;
    margin: 2px 0 5px;
    color: var(--navy-900);
  }
  .vevly-feature p{
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-600);
  }

  /* ---------- center product ---------- */
  .vevly-center{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
   .vevly-sparkle{
    position: absolute;
    color: var(--sky-400);
    opacity: 0.8;
  }
  .vevly-sparkle svg{ width: 30px; height: 30px; }
  .vevly-sparkle.sp1{ top: 4%; right: 4%; }
  .vevly-sparkle.sp2{ bottom: 8%; left: 0%; width: 18px; }

  .vevly-imgwrap{
    position: relative;
    width: 390px;
    height: 370px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vevly-imgwrap img{
    position: absolute;
    max-width: 100%;
    max-height: 770px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 30px 26px rgba(14,25,50,0.22));
    opacity: 0;
    transform: scale(0.92) translateY(14px);
    transition: opacity 700ms ease, transform 700ms cubic-bezier(.22,.9,.32,1);
    pointer-events: none;
  }
  .vevly-imgwrap img.active{
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .vevly-arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: #fff;
    box-shadow: 0 8px 20px -6px rgba(14,25,50,0.25), 0 0 0 1px rgba(127,168,224,0.25) inset;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
    transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
    padding: 0;
  }
  .vevly-arrow svg{
    width: 18px; height: 18px;
    stroke: var(--navy-900);
    fill: none;
    stroke-width: 2;
  }
  .vevly-arrow:hover{
    background: var(--sky-500);
    transform: translateY(-50%) scale(1.08);
    box-shadow: 0 10px 22px -6px rgba(77,121,184,0.5);
  }
  .vevly-arrow:hover svg{ stroke: #fff; }
  .vevly-arrow.prev{ left: -6px; }
  .vevly-arrow.next{ right: -6px; }

  .vevly-dots{
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 9px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .vevly-dots button{
    width: 8px; height: 8px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: var(--ice-200);
    cursor: pointer;
    transition: background 300ms ease, width 300ms ease;
  }
  .vevly-dots button.active{
    background: var(--sky-500);
    width: 22px;
    border-radius: 4px;
  }

</style>

<section class="vevly-why-choose" data-vevly-instance>
  <div class="vevly-inner">

    <div class="vevly-stage">

      <div class="vevly-col left" data-vevly="col-left"></div>

      <div class="vevly-center">
        <div class="vevly-blob"></div>
        <span class="vevly-sparkle sp1">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 5.5 2.5 7 8 8-5.5 1-7 2.5-8 8-1-5.5-2.5-7-8-8 5.5-1 7-2.5 8-8z"/></svg>
        </span>
        <span class="vevly-sparkle sp2">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 5.5 2.5 7 8 8-5.5 1-7 2.5-8 8-1-5.5-2.5-7-8-8 5.5-1 7-2.5 8-8z"/></svg>
        </span>
        <div class="vevly-imgwrap" data-vevly="imgwrap"></div>

        <button type="button" class="vevly-arrow prev" data-vevly="prev" aria-label="Previous product">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>

        <button type="button" class="vevly-arrow next" data-vevly="next" aria-label="Next product">

</section>

<script>
(function(){
  "use strict";

  // ---- ICONS (inline, reused across features) ----
  var icons = {
    drop: '<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
    leaf: '<path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16z"/><path d="M8 20c4-4 8-8 12-12"/>',
    shield: '<path d="M12 3l7 3v6c0 5-3.2 8.4-7 9-3.8-.6-7-4-7-9V6l7-3z"/>',
    wind: '<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 16h14a3 3 0 1 1-3 3"/>',
    spark: '<path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l4 4M15 15l4 4M5 19l4-4M15 9l4-4"/>'
  };
  function iconSvg(name){
    return '<svg viewBox="0 0 24 24">' + icons[name] + '</svg>';
  }

  // ---- SLIDE DATA: each slide = 1 product image + 4 surrounding features ----
  // "src" is left empty on each slide on purpose — paste your own
  // https:// image URL where marked "PASTE IMAGE URL HERE" below.
  var slides = [
    {
      // PASTE IMAGE URL HERE — Earth Kingdom Organic Poppy Seeds (Khas Khas)
      src: "https://earthkingdom.in/wp-content/uploads/2026/09/13-1.png",
      alt: "Earth Kingdom Organic Poppy Seeds (Khas Khas)",
      left: [
        { icon:'leaf',  title:'100% Natural',      text:'Pure, single-ingredient poppy seeds with no additives or fillers.' },
        { icon:'shield',title:'Rich in Nutrients',  text:'A natural source of calcium, protein and healthy fats.' }
      ],
      right: [
        { icon:'drop',  title:'Kitchen Versatile',  text:'Perfect for garnishing, grinding into pastes, and baking.' },
        { icon:'spark', title:'Premium Quality',    text:'Handpicked and carefully cleaned for a fine, even texture.' }
      ]
    },
    {
      // PASTE IMAGE URL HERE — Earth Kingdom Sea Buckthorn Pulp
      src: "https://earthkingdom.in/wp-content/uploads/2026/09/14.png",
      alt: "Earth Kingdom Sea Buckthorn Pulp - Cold Pressed Berry Concentrate",
      left: [
        { icon:'drop',  title:'Cold Pressed',       text:'Gently extracted from Himalayan berries to lock in nutrients.' },
        { icon:'shield',title:'Vitamin C Rich',     text:'A natural boost of antioxidants to support daily immunity.' }
      ],
      right: [
        { icon:'leaf',  title:'Omega 3-6-7-9',      text:'A rare berry packed with essential fatty acids for vitality.' },
        { icon:'wind',  title:'No Additives',       text:'No artificial flavours or colours — just pure Himalayan goodness.' }
      ]
    },
    {
      // PASTE IMAGE URL HERE — Earth Kingdom Pure Himalayan Shilajit Gold Resin
      src: "https://earthkingdom.in/wp-content/uploads/2026/09/12.png",
      alt: "Earth Kingdom Pure Himalayan Shilajit Gold Resin",
      left: [
        { icon:'shield',title:'Ayurvedic Formula',  text:'A proprietary blend rooted in traditional wellness wisdom.' },
        { icon:'spark', title:'Boosts Vitality',    text:'Supports natural energy and stamina for everyday strength.' }
      ],
      right: [
        { icon:'drop',  title:'Pure Himalayan Resin', text:'Sourced from high altitudes, rich in fulvic acid and minerals.' },
        { icon:'leaf',  title:'Trusted Purity',     text:'Carefully processed to preserve its natural potency.' }
      ]
    }
  ];

  function featureHTML(f){
    return '<div class="vevly-feature">' +
             '<div class="vevly-icon">' + iconSvg(f.icon) + '</div>' +
             '<div><h3>' + f.title + '</h3><p>' + f.text + '</p></div>' +
           '</div>';
  }

  // Initialize one widget instance, fully scoped to its own <section>.
  // This means pasting this block multiple times on the same WordPress
  // page works correctly — each carousel runs independently.
  function initInstance(section){
    var imgwrap  = section.querySelector('[data-vevly="imgwrap"]');
    var colLeft  = section.querySelector('[data-vevly="col-left"]');
    var colRight = section.querySelector('[data-vevly="col-right"]');
    var dotsWrap = section.querySelector('[data-vevly="dots"]');
    var prevBtn  = section.querySelector('[data-vevly="prev"]');
    var nextBtn  = section.querySelector('[data-vevly="next"]');

    if (!imgwrap || !colLeft || !colRight || !dotsWrap || !prevBtn || !nextBtn) return;

    // build image elements
    slides.forEach(function(s, i){
      var img = document.createElement('img');
      img.src = s.src;
      img.alt = s.alt || ('Earth Kingdom product ' + (i + 1));
      if (i === 0) img.classList.add('active');
      imgwrap.appendChild(img);
    });
    var imgEls = imgwrap.querySelectorAll('img');

    // build dots
    slides.forEach(function(s, i){
      var b = document.createElement('button');
      b.type = 'button';
      if (i === 0) b.classList.add('active');
      b.setAttribute('aria-label', 'Show product ' + (i + 1));
      b.addEventListener('click', function(){ goTo(i); });
      dotsWrap.appendChild(b);
    });
    var dotEls = dotsWrap.querySelectorAll('button');

    function renderText(i){
      var s = slides[i];
      colLeft.innerHTML  = s.left.map(featureHTML).join('');
      colRight.innerHTML = s.right.map(featureHTML).join('');
      // stagger the feature entrance animation
      var all = [].slice.call(colLeft.children).concat([].slice.call(colRight.children));
      all.forEach(function(el, idx){
        el.style.animationDelay = (idx * 90) + 'ms';
      });
    }

    var current = 0;
    var timer = null;
    var INTERVAL = 4000;

    function goTo(i){
      if (i === current) return;
      imgEls[current].classList.remove('active');
      dotEls[current].classList.remove('active');
      current = i;
      imgEls[current].classList.add('active');
      dotEls[current].classList.add('active');
      renderText(current);
      restart();
    }

    function next(){ goTo((current + 1) % slides.length); }
    function prev(){ goTo((current - 1 + slides.length) % slides.length); }

    function restart(){
      if (timer) clearInterval(timer);
      timer = setInterval(next, INTERVAL);
    }

    renderText(0);
    restart();

    nextBtn.addEventListener('click', function(){ next(); restart(); });
    prevBtn.addEventListener('click', function(){ prev(); restart(); });

    // pause on hover for readability
    section.addEventListener('mouseenter', function(){ if (timer) clearInterval(timer); });
    section.addEventListener('mouseleave', restart);
  }

  function init(){
    var sections = document.querySelectorAll('.vevly-why-choose[data-vevly-instance]');
    sections.forEach(function(section){
      // guard against double-init if the block editor re-runs this script
      if (section.getAttribute('data-vevly-ready') === '1') return;
      section.setAttribute('data-vevly-ready', '1');
      initInstance(section);
    });
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
