<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Coverflow Carousel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0c0a09;
  }

  .coverflow-section {
    position: relative;
    width: 100%;
    min-height: 760px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 48px 0;
    user-select: none;
    background-color: #0c0a09;
    color: #ffffff;
  }

  /* Background ambience */
  .cf-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .cf-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.22) blur(32px);
    transform: scale(1.15);
    transition: opacity 1000ms ease, filter 1000ms ease;
  }
  .cf-bg-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(12,10,9,0.3) 0%, rgba(12,10,9,0.92) 100%);
  }

  .cf-wrap {
    position: relative;
    width: 100%;
    max-width: 1152px;
    margin: 0 auto;
    padding: 0 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Eyebrow */
  .cf-eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .cf-eyebrow .line {
    width: 36px;
    height: 1px;
  }
  .cf-eyebrow .line.left { background: linear-gradient(90deg, transparent, #c5a880); }
  .cf-eyebrow .line.right { background: linear-gradient(90deg, #c5a880, transparent); }
  .cf-eyebrow h3 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c5a880;
    margin: 0;
  }

  /* Stage */
  .cf-stage {
    position: relative;
    width: 100%;
    height: 520px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 32px;
    perspective: 1400px;
  }

  .cf-card {
    position: absolute;
    width: 330px;
    height: 500px;
    border-radius: 18px;
    overflow: hidden;
    background-color: #171311;
    border: 1px solid rgba(255,255,255,0.12);
    transform-origin: center center;
    transition: all 800ms cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  }
  .cf-card.center {
    box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 35px rgba(197,168,128,0.25);
    cursor: default;
  }
  .cf-card:not(.center) {
    cursor: pointer;
  }

  .cf-card img.photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cf-card .vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 25%, rgba(0,0,0,0.68) 60%, rgba(0,0,0,0.96) 100%);
    pointer-events: none;
    z-index: 10;
  }

  .cf-card .content {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 20px 18px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
    z-index: 20;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 500ms ease, transform 500ms ease;
    pointer-events: none;
  }
  .cf-card.center .content {
    opacity: 1;
    transform: translateY(0px);
    pointer-events: auto;
  }

  .cf-tag-row {
    text-align: right;
    width: 100%;
    padding-right: 4px;
  }
  .cf-tag-row span {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }

  .cf-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    margin-top: auto;
    padding-bottom: 4px;
  }
  .cf-body h2 {
    font-size: 1.65rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #ffffff;
    margin: 0;
    line-height: 1.1;
    text-shadow: 0 3px 12px rgba(0,0,0,0.95);
  }
  .cf-body .line2 {
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #f3f0ea;
    line-height: 1.2;
    text-shadow: 0 3px 10px rgba(0,0,0,0.9);
  }
  .cf-divider {
    width: 34px;
    height: 2px;
    background-color: #c5a880;
    border-radius: 2px;
    margin: 5px auto 4px;
    box-shadow: 0 0 8px rgba(197,168,128,0.7);
  }
  .cf-desc {
    font-size: 0.82rem;
    font-style: italic;
    color: rgba(255,255,255,0.9);
    max-width: 280px;
    margin: 0 0 10px;
    line-height: 1.3;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  .cf-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 18px;
    border-radius: 9999px;
    background: linear-gradient(135deg, #c5a880 0%, #a48256 100%);
    color: #110d0c;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4), 0 0 15px rgba(197,168,128,0.3);
    cursor: pointer;
    transition: transform 200ms ease, box-shadow 200ms ease;
    border: none;
  }
  .cf-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 20px rgba(197,168,128,0.45);
  }
  .cf-cta svg { display: block; }

  /* Nav arrows */
  .cf-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 40;
    transition: all 200ms ease;
  }
  .cf-nav-btn:hover {
    background-color: rgba(0,0,0,0.8);
    border-color: rgba(255,255,255,0.4);
  }
  .cf-nav-btn.prev { left: 24px; }
  .cf-nav-btn.next { right: 24px; }

  /* Pagination */
  .cf-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 30;
  }
  .cf-dot {
    height: 8px;
    width: 8px;
    border-radius: 9999px;
    background-color: rgba(255,255,255,0.25);
    border: none;
    cursor: pointer;
    transition: all 300ms ease;
    padding: 0;
  }
  .cf-dot.active {
    width: 28px;
    background-color: #c5a880;
    box-shadow: 0 0 10px rgba(197,168,128,0.7);
  }

  @media (max-width: 640px) {
    .cf-stage { height: 460px; }
    .cf-card { width: 260px; height: 420px; }
    .cf-nav-btn.prev { left: 8px; }
    .cf-nav-btn.next { right: 8px; }
  }
</style>
</head>
<body>

<section
  class="coverflow-section"
  id="coverflowSection"
  aria-roledescription="carousel"
  aria-label="Best sellers"
>
  <div class="cf-bg">
    <img id="cfBgImg" src="" alt="ambience background" />
    <div class="cf-bg-overlay"></div>
  </div>

  <div class="cf-wrap">
    <div class="cf-eyebrow">
      <span class="line left"></span>
      <h3 id="cfSectionLabel">BEST SELLERS</h3>
      <span class="line right"></span>
    </div>

    <div class="cf-stage" id="cfStage"></div>

    <button class="cf-nav-btn prev" id="cfPrev" aria-label="Previous dish">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <button class="cf-nav-btn next" id="cfNext" aria-label="Next dish">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <div class="cf-dots" id="cfDots"></div>
  </div>
</section>

<script>
(function () {
  // ---- Config / Data ----
  const items = [
    {
      tag: "#Signature",
      titleLine1: "BUTTER CHICKEN",
      titleLine2: "– DELHI HERITAGE",
      desc: "Velvety roasted tomato and fenugreek gravy with tender charred chicken",
      img: "https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=800&auto=format&fit=crop&q=80",
      ctaText: "View Menu",
      ctaUrl: "#",
    },
    {
      tag: "#ChefSpecial",
      titleLine1: "TANDOORI CHOPS",
      titleLine2: "– SMOKED SPICE",
      desc: "Grass-fed lamb chops charred in live charcoal tandoor with Kashmiri spices",
      img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=800&auto=format&fit=crop&q=80",
      ctaText: "View Menu",
      ctaUrl: "#",
    },
    {
      tag: "#Vegetarian",
      titleLine1: "PANEER TIKKA",
      titleLine2: "– CLAY ROASTED",
      desc: "Artisan cottage cheese marinated in spiced yogurt, bell peppers & saffron",
      img: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=800&auto=format&fit=crop&q=80",
      ctaText: "View Menu",
      ctaUrl: "#",
    },
    {
      tag: "#CoastalCatch",
      titleLine1: "MALABAR PRAWNS",
      titleLine2: "– COCONUT GRAVY",
      desc: "Jumbo wild tiger prawns simmered in fragrant curry leaves and coconut milk",
      img: "https://images.unsplash.com/photo-1559847844-5315695dadae?w=800&auto=format&fit=crop&q=80",
      ctaText: "View Menu",
      ctaUrl: "#",
    },
    {
      tag: "#ArtisanBake",
      titleLine1: "TRUFFLE NAAN",
      titleLine2: "– CHARCOAL OVEN",
      desc: "Crispy puffed leavened bread brushed with pure ghee and black winter truffle",
      img: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=800&auto=format&fit=crop&q=80",
      ctaText: "View Menu",
      ctaUrl: "#",
    },
  ];

  const AUTOPLAY = true;
  const AUTOPLAY_DELAY = 5000;

  const total = items.length;
  let currentIndex = 0;
  let isHovered = false;
  let autoplayTimer = null;
  let touchStartX = 0;

  // ---- DOM refs ----
  const section = document.getElementById("coverflowSection");
  const stage = document.getElementById("cfStage");
  const dotsWrap = document.getElementById("cfDots");
  const bgImg = document.getElementById("cfBgImg");
  const prevBtn = document.getElementById("cfPrev");
  const nextBtn = document.getElementById("cfNext");

  // ---- Build cards ----
  const cardEls = items.map((item, idx) => {
    const card = document.createElement("div");
    card.className = "cf-card";
    card.dataset.index = idx;

    card.innerHTML = `
      <img class="photo" src="${item.img}" alt="${item.titleLine1}" />
      <div class="vignette"></div>
      <div class="content">
        <div class="cf-tag-row"><span>${item.tag || ""}</span></div>
        <div class="cf-body">
          <h2>${item.titleLine1}</h2>
          ${item.titleLine2 ? `<span class="line2">${item.titleLine2}</span>` : ""}
          <div class="cf-divider"></div>
          ${item.desc ? `<p class="cf-desc">${item.desc}</p>` : ""}
          <a class="cf-cta" href="${item.ctaUrl || "#"}" data-index="${idx}">
            <span>${item.ctaText || "View Menu"}</span>
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </a>
        </div>
      </div>
    `;

    card.addEventListener("click", () => {
      if (idx !== currentIndex) goToSlide(idx);
    });

    stage.appendChild(card);
    return card;
  });

  // ---- Build dots ----
  const dotEls = items.map((_, idx) => {
    const dot = document.createElement("button");
    dot.className = "cf-dot";
    dot.setAttribute("aria-label", `Go to slide ${idx + 1}`);
    dot.addEventListener("click", () => goToSlide(idx));
    dotsWrap.appendChild(dot);
    return dot;
  });

  // ---- CTA click handler (delegated) ----
  stage.addEventListener("click", (e) => {
    const cta = e.target.closest(".cf-cta");
    if (cta) {
      // Prevent navigating to "#" — replace with your own onCtaClick logic
      const idx = Number(cta.dataset.index);
      if (items[idx].ctaUrl === "#") {
        e.preventDefault();
        console.log("CTA clicked for:", items[idx].titleLine1);
      }
    }
  });

  // ---- Render ----
  function render() {
    cardEls.forEach((card, idx) => {
      const offset = (idx - currentIndex + total) % total;

      let transform = "translateX(0px) scale(0.4) rotateY(0deg)";
      let opacity = 0;
      let zIndex = 0;
      let filter = "brightness(0.4) blur(2px)";
      let isCenter = false;

      if (offset === 0) {
        isCenter = true;
        transform = "translateX(0px) scale(1) rotateY(0deg)";
        opacity = 1;
        zIndex = 30;
        filter = "brightness(1)";
      } else if (offset === 1) {
        transform = "translateX(285px) scale(0.84) rotateY(-24deg)";
        opacity = 0.65;
        zIndex = 20;
        filter = "brightness(0.75)";
      } else if (offset === 2) {
        transform = "translateX(510px) scale(0.68) rotateY(-38deg)";
        opacity = 0.38;
        zIndex = 10;
        filter = "brightness(0.55) blur(1px)";
      } else if (offset === total - 1) {
        transform = "translateX(-285px) scale(0.84) rotateY(24deg)";
        opacity = 0.65;
        zIndex = 20;
        filter = "brightness(0.75)";
      } else if (offset === total - 2) {
        transform = "translateX(-510px) scale(0.68) rotateY(38deg)";
        opacity = 0.38;
        zIndex = 10;
        filter = "brightness(0.55) blur(1px)";
      }

      card.style.transform = transform;
      card.style.opacity = opacity;
      card.style.zIndex = zIndex;
      card.style.filter = filter;
      card.classList.toggle("center", isCenter);
      card.style.cursor = isCenter ? "default" : "pointer";
    });

    dotEls.forEach((dot, idx) => {
      dot.classList.toggle("active", idx === currentIndex);
    });

    bgImg.src = items[currentIndex].img;
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % total;
    render();
  }

  function prevSlide() {
    currentIndex = (currentIndex - 1 + total) % total;
    render();
  }

  function goToSlide(idx) {
    currentIndex = idx % total;
    render();
  }

  // ---- Autoplay ----
  function startAutoplay() {
    if (!AUTOPLAY || total <= 1) return;
    stopAutoplay();
    autoplayTimer = setInterval(() => {
      if (!isHovered) nextSlide();
    }, AUTOPLAY_DELAY);
  }
  function stopAutoplay() {
    if (autoplayTimer) clearInterval(autoplayTimer);
  }

  // ---- Event listeners ----
  prevBtn.addEventListener("click", prevSlide);
  nextBtn.addEventListener("click", nextSlide);

  section.addEventListener("mouseenter", () => { isHovered = true; });
  section.addEventListener("mouseleave", () => { isHovered = false; });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") prevSlide();
    if (e.key === "ArrowRight") nextSlide();
  });

  section.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  section.addEventListener("touchend", (e) => {
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 45) {
      if (diff < 0) nextSlide();
      else prevSlide();
    }
  });

  // ---- Init ----
  render();
  startAutoplay();
})();
</script>

</body>
</html>
