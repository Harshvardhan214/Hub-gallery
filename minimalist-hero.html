<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mnmlst. — Minimalist Hero</title>
  <style>
    /* ===== Reset & Base ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --fg-muted: rgba(17, 17, 17, 0.6);
      --yellow: #ea0808;
      --yellow-muted: rgba(234, 8, 8, 0.9);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }

    /* ===== Hero Container ===== */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      width: 100%;
      padding: 2rem 1.5rem;
      overflow: hidden;
      background: var(--bg);
    }

    @media (min-width: 768px) {
      .hero {
        padding: 3rem;
      }
    }

    /* ===== Animations ===== */
    @keyframes fadeSlideLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes circleScaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes imageFloatUp {
      from { opacity: 0; transform: translateY(50px) scale(1.5); }
      to   { opacity: 1; transform: translateY(0) scale(1.5); }
    }

    .anim-header      { animation: fadeSlideLeft 0.5s ease-out both; }
    .anim-header-right { animation: fadeSlideRight 0.5s ease-out both; }
    .anim-text-left   { animation: fadeSlideUp 0.6s ease-out 1s both; }
    .anim-circle      { animation: circleScaleIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
    .anim-image       { animation: imageFloatUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }
    .anim-overlay     { animation: fadeSlideUp 0.6s ease-out 1.2s both; }
    .anim-footer-left  { animation: fadeSlideUp 0.5s ease-out 1.2s both; }
    .anim-footer-right { animation: fadeSlideUp 0.5s ease-out 1.3s both; }

    /* ===== Header ===== */
    .hero-header {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1280px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .nav-desktop {
        display: flex;
      }
    }

    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--fg);
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }
    }

    .hamburger span {
      display: block;
      height: 2px;
      background: var(--fg);
      border-radius: 1px;
    }

    .hamburger span:nth-child(1),
    .hamburger span:nth-child(2) {
      width: 24px;
    }

    .hamburger span:nth-child(3) {
      width: 20px;
    }

    /* ===== Main Content ===== */
    .hero-main {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      max-width: 1280px;
    }

    @media (min-width: 768px) {
      .hero-main {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    /* --- Left Text --- */
    .hero-left {
      z-index: 20;
      text-align: center;
      order: 2;
    }

    @media (min-width: 768px) {
      .hero-left {
        text-align: left;
        order: 1;
      }
    }

    .hero-left p {
      max-width: 320px;
      margin: 0 auto;
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--fg-muted);
    }

    @media (min-width: 768px) {
      .hero-left p {
        margin: 0;
      }
    }

    .read-more {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: opacity 0.2s;
    }

    .read-more:hover {
      opacity: 0.7;
    }

    /* --- Center Image with Circle --- */
    .hero-center {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      order: 1;
      height: 100%;
    }

    @media (min-width: 768px) {
      .hero-center {
        order: 2;
      }
    }

    .circle-bg {
      position: absolute;
      z-index: 0;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--yellow-muted);
    }

    @media (min-width: 768px) {
      .circle-bg {
        width: 400px;
        height: 400px;
      }
    }

    @media (min-width: 1024px) {
      .circle-bg {
        width: 500px;
        height: 500px;
      }
    }

    .hero-img {
      position: relative;
      z-index: 10;
      width: 14rem;
      height: auto;
      object-fit: cover;
      transform: scale(1.5);
    }

    @media (min-width: 768px) {
      .hero-img {
        width: 16rem;
      }
    }

    @media (min-width: 1024px) {
      .hero-img {
        width: 25rem;
      }
    }

    /* --- Right Text (Overlay) --- */
    .hero-right {
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      order: 3;
    }

    @media (min-width: 768px) {
      .hero-right {
        justify-content: flex-start;
      }
    }

    .hero-right h1 {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 0.9;
      color: var(--fg);
    }

    @media (min-width: 768px) {
      .hero-right h1 {
        font-size: 6rem;
      }
    }

    @media (min-width: 1024px) {
      .hero-right h1 {
        font-size: 8rem;
      }
    }

    /* ===== Footer ===== */
    .hero-footer {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1280px;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .social-link {
      color: var(--fg-muted);
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-link:hover {
      color: var(--fg);
    }

    .social-link svg {
      width: 20px;
      height: 20px;
    }

    .location {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg-muted);
    }

    /* ===== Mobile Nav Overlay ===== */
    .mobile-nav-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .mobile-nav-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100%;
      background: var(--bg);
      z-index: 50;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mobile-nav.open {
      transform: translateX(0);
    }

    .mobile-nav .close-btn {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--fg);
    }

    .mobile-nav .nav-link {
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- ===== HEADER ===== -->
    <header class="hero-header">
      <div class="logo anim-header">mnmlst.</div>
      <nav class="nav-desktop anim-header">
        <a href="#" class="nav-link">HOME</a>
        <a href="#" class="nav-link">PRODUCT</a>
        <a href="#" class="nav-link">STORE</a>
        <a href="#" class="nav-link">ABOUT US</a>
      </nav>
      <button class="hamburger anim-header-right" id="menuBtn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="hero-main">
      <!-- Left: Text -->
      <div class="hero-left anim-text-left">
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum ultrices, justo vel tempus.
        </p>
        <a href="#" class="read-more">Read More</a>
      </div>

      <!-- Center: Image + Circle -->
      <div class="hero-center">
        <div class="circle-bg anim-circle"></div>
        <img
          src=" images\IRONMAN-2.png"
          alt="A portrait of a person in a black turtleneck, in profile."
          class="hero-img anim-image"
          onerror="this.onerror=null;this.src='https://placehold.co/400x600/eab308/ffffff?text=Image+Not+Found';"
        />
      </div>

      <!-- Right: Overlay Text -->
      <div class="hero-right anim-overlay">
        <h1>
          IRON<br>
          -  MAN
        </h1>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="hero-footer">
      <div class="social-links anim-footer-left">
        <!-- Facebook -->
        <a href="#" class="social-link" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>
        <!-- Instagram -->
        <a href="#" class="social-link" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </a>
        <!-- Twitter / X -->
        <a href="#" class="social-link" aria-label="Twitter">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
          </svg>
        </a>
        <!-- LinkedIn -->
        <a href="#" class="social-link" aria-label="LinkedIn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
      </div>
      <div class="location anim-footer-right">Arlington Heights, IL</div>
    </footer>
  </div>

  <!-- ===== MOBILE NAV OVERLAY ===== -->
  <div class="mobile-nav-overlay" id="mobileOverlay"></div>
  <div class="mobile-nav" id="mobileNav">
    <button class="close-btn" id="closeBtn">&times;</button>
    <a href="#" class="nav-link">HOME</a>
    <a href="#" class="nav-link">PRODUCT</a>
    <a href="#" class="nav-link">STORE</a>
    <a href="#" class="nav-link">ABOUT US</a>
  </div>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const mobileNav = document.getElementById('mobileNav');
    const mobileOverlay = document.getElementById('mobileOverlay');

    function openMenu() {
      mobileNav.classList.add('open');
      mobileOverlay.classList.add('open');
    }

    function closeMenu() {
      mobileNav.classList.remove('open');
      mobileOverlay.classList.remove('open');
    }

    menuBtn.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    mobileOverlay.addEventListener('click', closeMenu);
  </script>
</body>
</html>
