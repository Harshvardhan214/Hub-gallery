<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glare Card — Vanilla HTML/CSS/JS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #020617;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
        }

        .page-title {
            color: #94a3b8;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
            text-align: center;
        }

        .page-title strong {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* ============================================
               GLARE CARD
            ============================================ */
        .glare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            max-width: 1200px;
            width: 100%;
            justify-items: center;
        }

        .glare-card {
            --m-x: 50%;
            --m-y: 50%;
            --r-x: 0deg;
            --r-y: 0deg;
            --bg-x: 50%;
            --bg-y: 50%;
            --duration: 300ms;
            --easing: ease;
            --opacity: 0;
            --radius: 48px;
            --foil-size: 100%;
            --step: 5%;

            position: relative;
            width: 320px;
            aspect-ratio: 17 / 21;
            perspective: 600px;
            cursor: default;
            border-radius: var(--radius);
            transition: transform var(--duration) var(--easing);
            will-change: transform;
            /* contain: layout style; */
        }

        .glare-card-inner {
            height: 100%;
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid #1e293b;
            overflow: hidden;
            transform: rotateY(var(--r-x)) rotateX(var(--r-y));
            transition: transform var(--duration) var(--easing);
            will-change: transform;
            transform-origin: center center;
            display: grid;
            position: relative;
        }

        /* Layer 1: Base background + content */
        .glare-base {
            grid-area: 1 / 1;
            height: 100%;
            width: 100%;
            background: #020617;
            border-radius: var(--radius);
            mix-blend-mode: soft-light;
            clip-path: inset(0 round var(--radius));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Layer 2: Spotlight glare (follows cursor) */
        .glare-spotlight {
            grid-area: 1 / 1;
            height: 100%;
            width: 100%;
            border-radius: var(--radius);
            mix-blend-mode: soft-light;
            clip-path: inset(0 0 1px 0 round var(--radius));
            opacity: var(--opacity);
            transition: opacity var(--duration) var(--easing),
                        background var(--duration) var(--easing);
            will-change: background;
            background: radial-gradient(
                farthest-corner circle at var(--m-x) var(--m-y),
                rgba(255, 255, 255, 0.8) 10%,
                rgba(255, 255, 255, 0.65) 20%,
                rgba(255, 255, 255, 0) 90%
            );
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        /* Layer 3: Foil / Rainbow iridescent effect */
        .glare-foil {
            grid-area: 1 / 1;
            height: 100%;
            width: 100%;
            border-radius: var(--radius);
            mix-blend-mode: color-dodge;
            opacity: var(--opacity);
            will-change: background, opacity;
            transition: opacity var(--duration) var(--easing);
            clip-path: inset(0 0 1px 0 round var(--radius));
            position: relative;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .glare-foil::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background:
                /* pattern (foil svg) */
                url("data:image/svg+xml,%3Csvg width='26' height='26' viewBox='0 0 26 26' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.99994 3.419C2.99994 3.419 21.6142 7.43646 22.7921 12.153C23.97 16.8695 3.41838 23.0306 3.41838 23.0306' stroke='white' stroke-width='5' stroke-miterlimit='3.86874' stroke-linecap='round' style='mix-blend-mode:darken'/%3E%3C/svg%3E") center / 100% no-repeat,
                /* rainbow */
                repeating-linear-gradient(
                    0deg,
                    rgb(255, 119, 115) calc(var(--step) * 1),
                    rgba(255, 237, 95, 1) calc(var(--step) * 2),
                    rgba(168, 255, 95, 1) calc(var(--step) * 3),
                    rgba(131, 255, 247, 1) calc(var(--step) * 4),
                    rgba(120, 148, 255, 1) calc(var(--step) * 5),
                    rgb(216, 117, 255) calc(var(--step) * 6),
                    rgb(255, 119, 115) calc(var(--step) * 7)
                ) 0% var(--bg-y) / 200% 700% no-repeat,
                /* diagonal */
                repeating-linear-gradient(
                    128deg,
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 10%, 60%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                ) var(--bg-x) var(--bg-y) / 300% no-repeat,
                /* shade */
                radial-gradient(
                    farthest-corner circle at var(--m-x) var(--m-y),
                    rgba(255, 255, 255, 0.1) 12%,
                    rgba(255, 255, 255, 0.15) 20%,
                    rgba(255, 255, 255, 0.25) 120%
                ) var(--bg-x) var(--bg-y) / 300% no-repeat;

            background-blend-mode: hue, hue, hue, overlay;
            position: relative;
            z-index: 1;
        }

        .glare-foil::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            mix-blend-mode: exclusion;
            background: inherit;
            background-size: var(--foil-size), 200% 400%, 800%, 200%;
            background-position:
                center,
                0% var(--bg-y),
                calc(var(--bg-x) * -1) calc(var(--bg-y) * -1),
                var(--bg-x) var(--bg-y);
            background-blend-mode: soft-light, hue, hard-light;
        }

        /* Hover state — increase opacity */
        .glare-card:hover {
            --opacity: 0.6;
            --duration: 200ms;
            --easing: linear;
        }

        .glare-card:hover .glare-card-inner {
            filter: none;
        }

        /* ============================================
               Card Content Styles
            ============================================ */

        /* Style 1: Icon center */
        .card-icon-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: white;
            text-align: center;
        }

        .card-icon-center svg {
            width: 56px;
            height: 56px;
            color: white;
        }

        .card-icon-center p {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Style 2: Full-bleed image */
        .card-image-full {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius);
        }

        /* Style 3: Bottom content */
        .card-bottom-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 2rem 1.5rem;
            width: 100%;
            height: 100%;
            color: white;
            text-align: left;
        }

        .card-bottom-content .title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-bottom-content .desc {
            font-size: 1rem;
            color: #a3a3a3;
            line-height: 1.5;
            font-weight: 400;
        }

        /* ============================================
               Back to Hub
            ============================================ */
        .back-to-hub {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 100px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .back-to-hub:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .back-to-hub svg {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 768px) {
            .glare-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .glare-card {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <h1 class="page-title">✦ <strong>Glare Card</strong> — Pure CSS / JS</h1>

    <div class="glare-grid">

        <!-- Card 1: Icon Center -->
        <div class="glare-card" data-glare>
            <div class="glare-card-inner">
                <div class="glare-base">
                    <div class="card-icon-center">
                        <svg width="66" height="65" viewBox="0 0 66 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 8.05571C8 8.05571 54.9009 18.1782 57.8687 30.062C60.8365 41.9458 9.05432 57.4696 9.05432 57.4696" stroke="currentColor" stroke-width="15" stroke-miterlimit="3.86874" stroke-linecap="round"/>
                        </svg>
                        <p>Glare Effect</p>
                    </div>
                </div>
                <div class="glare-spotlight"></div>
                <div class="glare-foil"></div>
            </div>
        </div>

        <!-- Card 2: Full Image -->
        <div class="glare-card" data-glare>
            <div class="glare-card-inner">
                <div class="glare-base" style="padding:0; background:transparent;">
                    <img
                        class="card-image-full"
                        src="https://images.unsplash.com/photo-1512618831669-521d4b375f5d?q=80&w=3388&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Mountain landscape"
                        loading="lazy"
                    />
                </div>
                <div class="glare-spotlight"></div>
                <div class="glare-foil"></div>
            </div>
        </div>

        <!-- Card 3: Bottom Content -->
        <div class="glare-card" data-glare>
            <div class="glare-card-inner">
                <div class="glare-base" style="padding:0; background:transparent;">
                    <div class="card-bottom-content">
                        <p class="title">The greatest trick</p>
                        <p class="desc">The greatest trick the devil ever pulled was to convince the world that he didn't exist.</p>
                    </div>
                </div>
                <div class="glare-spotlight"></div>
                <div class="glare-foil"></div>
            </div>
        </div>

    </div>

    <!-- Back to Hub -->
    <a href="components-hub.html" class="back-to-hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>Components Hub</span>
    </a>

    <script>
        (function(){
            const cards = document.querySelectorAll('[data-glare]');

            cards.forEach(card => {
                const inner = card.querySelector('.glare-card-inner');
                const state = {
                    glare: { x: 50, y: 50 },
                    background: { x: 50, y: 50 },
                    rotate: { x: 0, y: 0 },
                };

                let isPointerInside = false;
                let timeoutId = null;

                function updateStyles() {
                    card.style.setProperty('--m-x', `${state.glare.x}%`);
                    card.style.setProperty('--m-y', `${state.glare.y}%`);
                    card.style.setProperty('--r-x', `${state.rotate.x}deg`);
                    card.style.setProperty('--r-y', `${state.rotate.y}deg`);
                    card.style.setProperty('--bg-x', `${state.background.x}%`);
                    card.style.setProperty('--bg-y', `${state.background.y}%`);
                }

                card.addEventListener('pointermove', (e) => {
                    const rotateFactor = 0.4;
                    const rect = card.getBoundingClientRect();

                    const position = {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top,
                    };

                    const percentage = {
                        x: (100 / rect.width) * position.x,
                        y: (100 / rect.height) * position.y,
                    };

                    const delta = {
                        x: percentage.x - 50,
                        y: percentage.y - 50,
                    };

                    state.background.x = 50 + percentage.x / 4 - 12.5;
                    state.background.y = 50 + percentage.y / 3 - 16.67;
                    state.rotate.x = -(delta.x / 3.5) * rotateFactor;
                    state.rotate.y = (delta.y / 2) * rotateFactor;
                    state.glare.x = percentage.x;
                    state.glare.y = percentage.y;

                    updateStyles();
                });

                card.addEventListener('pointerenter', () => {
                    isPointerInside = true;
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => {
                        if (isPointerInside) {
                            card.style.setProperty('--duration', '0s');
                        }
                    }, 300);
                });

                card.addEventListener('pointerleave', () => {
                    isPointerInside = false;
                    clearTimeout(timeoutId);
                    card.style.removeProperty('--duration');
                    state.rotate.x = 0;
                    state.rotate.y = 0;
                    updateStyles();
                });
            });
        })();
    </script>

</body>
</html>
